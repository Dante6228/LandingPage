<!doctype html>
<!-- Plantilla de la imagen social de /gallery, 1200×630 (public/og/gallery.jpg).
     Se renderiza con Chrome: node scripts/generate-social-images.mjs -->
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 300 700; src: url('../public/fonts/cormorant-garamond-italic-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 200 500; src: url('../public/fonts/montserrat-latin.woff2') format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; background: #1a130f; overflow: hidden; }
  .bg { position: absolute; inset: -30px; background: url('../src/assets/img/Profile.jpg') center/cover; opacity: .12; filter: sepia(.4) grayscale(1) blur(5px); }
  .vig { position: absolute; inset: 0; background: radial-gradient(circle at 30% 50%, rgba(60,40,20,.12), rgba(26,19,15,.92)); }
  .cover { position: absolute; left: 110px; top: 105px; width: 420px; height: 420px; padding: 8px; background: rgba(30,25,22,.5); border: 1px solid rgba(255,255,255,.06); box-shadow: 0 25px 50px -12px rgba(0,0,0,.6); }
  .cover div { width: 100%; height: 100%; background: url('../src/assets/img/Portrait.png') center/cover; }
  .text { position: absolute; left: 620px; right: 70px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; color: #E5E5E0; }
  .kicker { font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 15px; letter-spacing: .5em; text-transform: uppercase; color: rgba(229,229,224,.5); }
  h1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; font-size: 118px; line-height: 1; margin: 22px 0 0; }
  h2 { font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 18px; letter-spacing: .28em; text-transform: uppercase; color: #A8A8A0; margin: 26px 0 0; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.12); }
  .artist { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 34px; color: rgba(229,229,224,.8); margin: 14px 0 0; }
  .url { position: absolute; bottom: 34px; right: 70px; font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 14px; letter-spacing: .22em; color: rgba(229,229,224,.45); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="vig"></div>
  <div class="cover"><div></div></div>
  <div class="text">
    <span class="kicker">La Exhibición</span>
    <h1>Dreaming</h1>
    <h2>The Experience Hub</h2>
    <p class="artist">Alen Jeynrod</p>
  </div>
  <div class="url">alenjeynrod.com/gallery</div>
</body>
</html>

<!doctype html>
<!-- Plantilla de la imagen social 1200×630 (public/og/default.jpg). Se renderiza con Chrome:
     node scripts/generate-social-images.mjs -->
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 300 700; src: url('../public/fonts/cormorant-garamond-italic-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 200 500; src: url('../public/fonts/montserrat-latin.woff2') format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; background: #0c0a09; overflow: hidden; }
  .bg { position: absolute; inset: -20px; background: url('../src/assets/img/Profile.jpg') center/cover; opacity: .32; filter: sepia(.6) brightness(.75) contrast(1.1) blur(3px); }
  .vig { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(60,40,20,.12), rgba(12,10,9,.92)); }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #E5E5E0; text-align: center; }
  .avatar { width: 150px; height: 150px; border-radius: 50%; background: url('../src/assets/img/Profile.jpg') center/cover; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 0 60px rgba(249,115,22,.12); }
  h1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 104px; letter-spacing: .02em; margin: 34px 0 0; line-height: 1; }
  h2 { font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 17px; letter-spacing: .32em; text-transform: uppercase; color: #A8A8A0; margin: 22px 0 0; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.12); }
  .url { position: absolute; bottom: 34px; left: 0; right: 0; text-align: center; font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 15px; letter-spacing: .22em; color: rgba(229,229,224,.45); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="vig"></div>
  <div class="wrap">
    <div class="avatar"></div>
    <h1>Alen Jeynrod</h1>
    <h2>Pianist &amp; Composer</h2>
  </div>
  <div class="url">alenjeynrod.com</div>
</body>
</html>
